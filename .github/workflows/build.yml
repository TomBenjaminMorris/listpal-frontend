name: Build

on:
  workflow_call:
    inputs:
      upload-dist:
        description: Upload dist/ for a later deploy job
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No AWS access here, so nothing an npm package runs can reach the bucket
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      # Public Cognito identifiers, kept out of git; the build fails without them
      - name: Write src/config.json
        env:
          CONFIG: ${{ vars.FRONTEND_CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG" > src/config.json
          node -e "JSON.parse(require('fs').readFileSync('src/config.json', 'utf8'))"

      - run: npm ci
      - run: npm run build
      - run: npm test

      - if: inputs.upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
