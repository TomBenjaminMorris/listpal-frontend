name: Deploy

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: www.listpal.dev.vinsp.in
  # The www distribution. Never the root one (alias listpal.dev.vinsp.in), which only redirects.
  DISTRIBUTION_ID: E1AKHSV400BS9K

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-dist: true
    permissions:
      contents: read

  deploy:
    name: Upload and invalidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job can assume the deploy role, and it runs no project code
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::905016994436:role/listpal-frontend-deploy
          role-session-name: listpal-frontend-deploy-${{ github.run_id }}
          aws-region: eu-west-2

      # No --delete: visitors still holding a cached index.html need the previous bundles
      - name: Upload
        run: aws s3 sync dist/ "s3://$BUCKET" --no-progress

      # The cache TTL is a year, so nothing changes for visitors until this finishes
      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
